<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="flag-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flag-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="flag-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Base Shield -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#0f172a" filter="url(#shadow)"/>
  <clipPath id="inner-clip">
    <rect x="4" y="4" width="40" height="40" rx="10"/>
  </clipPath>
  <g clip-path="url(#inner-clip)">
    <!-- German Flag Tricolor Bars -->
    <rect x="4" y="4" width="40" height="13.33" fill="url(#flag-black)"/>
    <rect x="4" y="17.33" width="40" height="13.33" fill="url(#flag-red)"/>
    <rect x="4" y="30.66" width="40" height="13.34" fill="url(#flag-gold)"/>
    
    <!-- Modern Minimalist Compass/Calipers Tool Symbol in Center -->
    <circle cx="24" cy="24" r="13" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
    <!-- Compass / Caliper Icon -->
    <path d="M24 16 L24 20 M21 21 L17 29 M27 21 L31 29 M19 26 L29 26" 
          stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="24" cy="21" r="1.8" fill="#0f172a"/>
  </g>
  <rect x="4" y="4" width="40" height="40" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
</svg>
